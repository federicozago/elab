# Virtual host usato dall'immagine (vedi Dockerfile nella radice).
# Serve la SPA Quasar (dist/spa) come root del sito ed espone il backend PHP
# sotto /api (cartella reale /var/www/html/api con i suoi vendor/).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Fallback SPA: qualsiasi richiesta che non sia una chiamata /api,
        # un file o una cartella reale viene servita da index.html.
        # (Il router è in modalità 'hash', quindi è più una rete di sicurezza
        # che un requisito stretto, ma rende l'immagine pronta anche per 'history'.)
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
